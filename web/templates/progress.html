<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Progress</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Scan in Progress</h1>
        </header>

        <main>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <p class="progress-text" id="progress-text">Starting scan...</p>
                <p class="progress-percentage" id="progress-percentage">0%</p>
                <p class="page-stats" id="page-stats" style="margin-top: 1rem; font-size: 1.1rem; color: #666;"></p>
            </div>

            <div style="margin-top: 2rem; text-align: center;">
                <button id="cancel-btn" class="btn-danger" onclick="cancelScan()" style="display: none;">
                    Cancel Scan
                </button>
            </div>

            <div class="spinner"></div>
        </main>
    </div>

    <script>
        const scanId = "{{ scan_id }}";

        function updateProgress() {
            fetch(`/api/status/${scanId}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('progress-fill').style.width = data.progress + '%';
                    document.getElementById('progress-text').textContent = data.message;
                    document.getElementById('progress-percentage').textContent = data.progress + '%';

                    // Update page stats - only show during scan phase
                    const pageStatsEl = document.getElementById('page-stats');
                    let statsText = '';

                    // Only show stats during scan phase (not during crawl)
                    if (data.pages_scanned !== undefined && data.total_pages !== undefined) {
                        const discovered = data.total_pages;
                        const scanned = data.pages_scanned;
                        statsText = `${scanned} of ${discovered} pages scanned`;
                    }

                    pageStatsEl.textContent = statsText;

                    // Show cancel button if running
                    const cancelBtn = document.getElementById('cancel-btn');
                    if (data.status === 'running') {
                        cancelBtn.style.display = 'inline-block';
                    } else {
                        cancelBtn.style.display = 'none';
                    }

                    if (data.status === 'complete') {
                        window.location.reload();
                    } else if (data.status === 'cancelled') {
                        document.getElementById('progress-text').innerHTML =
                            `<span style="color: #856404;">Scan cancelled</span>`;
                        document.querySelector('.spinner').style.display = 'none';
                    } else if (data.status === 'failed') {
                        document.getElementById('progress-text').innerHTML =
                            `<span style="color: #c30000;">Error: ${data.error}</span>`;
                        document.querySelector('.spinner').style.display = 'none';
                    } else {
                        setTimeout(updateProgress, 1000);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    setTimeout(updateProgress, 2000);
                });
        }

        function cancelScan() {
            if (confirm('Are you sure you want to cancel this scan?')) {
                fetch(`/api/cancel/${scanId}`, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'cancelled') {
                            document.getElementById('progress-text').textContent = 'Cancelling...';
                            document.getElementById('cancel-btn').disabled = true;
                        }
                    })
                    .catch(error => {
                        console.error('Cancel error:', error);
                        alert('Failed to cancel scan');
                    });
            }
        }

        updateProgress();
    </script>
</body>
</html>
