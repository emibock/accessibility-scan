# Example configuration for accessibility scanner

# Target website
start_url: https://example.com
max_pages: 50

# WCAG version to test against (2.0, 2.1, or 2.2)
# Default: 2.2 (recommended)
wcag_level: "2.2"

# Authentication (optional - remove if not needed)
authentication:
  login_url: https://example.com/login

  # Use environment variables for credentials
  username: ${ENV:USERNAME}
  password: ${ENV:PASSWORD}

  # CSS selectors for login form
  username_selector: input[name='username']
  password_selector: input[name='password']
  submit_selector: button[type='submit']

  # Element visible after successful login
  success_indicator: .user-menu

# Browser settings
headless: true

# PDF Scanning settings (optional)
# These only apply when using scan-pdf command

# Use verapdf for comprehensive PDF/UA validation (if installed)
# Default: true (will use verapdf if available, fall back to Python checks if not)
use_verapdf: true

# verapdf validation profile
# Options: PDFUA-1, WCAG-2-1, WCAG-2-2
# Default: PDFUA-1
verapdf_profile: "PDFUA-1"

# Maximum PDF file size for remote downloads (MB)
# Default: 50
max_file_size: 50

# Detect scanned (image-only) PDFs using OCR
# Requires: pip install -e ".[ocr]" and tesseract installation
# Default: true (will use OCR detection if available)
detect_scanned: true
