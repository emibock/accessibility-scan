# Example configuration for accessibility scanner

# Target website
start_url: https://example.com
max_pages: 50

# WCAG version to test against (2.0, 2.1, or 2.2)
# Default: 2.2 (recommended)
wcag_level: "2.2"

# Authentication (optional - remove if not needed)
authentication:
  login_url: https://example.com/login

  # Use environment variables for credentials
  username: ${ENV:USERNAME}
  password: ${ENV:PASSWORD}

  # CSS selectors for login form
  username_selector: input[name='username']
  password_selector: input[name='password']
  submit_selector: button[type='submit']

  # Element visible after successful login
  success_indicator: .user-menu

  # Click-only auth (guest/SSO sign-in with no form fields) - omit
  # username/password and provide an explicit submit selector
  # login_url: https://example.com/login
  # submit_selector: button[type='submit']
  # success_indicator: .user-menu

# Browser settings
headless: true
